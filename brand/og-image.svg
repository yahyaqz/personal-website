<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Avero Designs — Premium Web Design in Calgary">
	<defs>
		<radialGradient id="glow" cx="26%" cy="-6%" r="80%">
			<stop offset="0%" stop-color="#2a1c20" />
			<stop offset="55%" stop-color="#140f11" />
			<stop offset="100%" stop-color="#0c0a0b" />
		</radialGradient>
		<linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#ece6e5" />
			<stop offset="100%" stop-color="#c0707f" />
		</linearGradient>
	</defs>

	<rect width="1200" height="630" fill="url(#glow)" />
	<rect width="1200" height="630" fill="none" />

	<!-- hairline frame -->
	<rect x="48" y="48" width="1104" height="534" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08" />

	<!-- brand mark + wordmark -->
	<g transform="translate(96, 104)">
		<rect width="52" height="52" rx="11" fill="#141112" stroke="#ffffff" stroke-opacity="0.08" />
		<path d="M15 40 L27 12 L39 40" fill="none" stroke-linejoin="round" stroke="#ECE6E5" stroke-width="6" stroke-linecap="square" />
		<path d="M20 31 H34" stroke="#C0707F" stroke-width="6" stroke-linecap="square" fill="none" />
		<text x="72" y="26" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#ECE6E5">AVERO</text>
		<text x="72" y="46" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="7" fill="#e6afb9">DESIGNS</text>
	</g>

	<!-- headline -->
	<text x="94" y="320" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#ECE6E5">Your website</text>
	<text x="94" y="416" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#rose)">can do more.</text>

	<!-- subline -->
	<text x="96" y="486" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#948a8c">Premium web design &amp; digital identity for visual brands.</text>

	<!-- footer meta -->
	<line x1="96" y1="536" x2="1104" y2="536" stroke="#ffffff" stroke-opacity="0.08" />
	<text x="96" y="566" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#948a8c">CALGARY, ALBERTA</text>
	<text x="1104" y="566" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#948a8c">AVERODESIGNS.COM</text>
</svg>
