				--bone: #ece6e5;

				--accent: #c0707f;
			}
			* { box-sizing: border-box; margin: 0; }
			html, body { height: 100%; }
			body {
				background: radial-gradient(120% 90% at 50% -10%, #1a1416, var(--ink) 60%);
				color: var(--bone);
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				display: grid;
				place-items: center;
				text-align: center;
				padding: 2rem;
				min-height: 100%;
			}
			.mark { width: 44px; height: 44px; margin: 0 auto 2.5rem; display: block; }
			.code {
				font-family: 'Archivo', system-ui, sans-serif;
				font-size: clamp(5rem, 22vw, 12rem);
				font-weight: 800;
				line-height: 0.9;
				letter-spacing: -0.04em;
				background: linear-gradient(180deg, var(--bone), var(--accent));
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}
			h1 {
				font-size: clamp(1.25rem, 3vw, 1.75rem);
				font-weight: 600;
				margin-top: 0.5rem;
			}
			p { color: var(--dim); margin: 1rem auto 2.5rem; max-width: 34ch; line-height: 1.6; }
			a.home {
				display: inline-flex;
				align-items: center;
				gap: 0.6rem;
				padding: 0.9rem 1.6rem;
				border-radius: 999px;
				background: var(--accent);
				color: var(--ink);
				font-weight: 600;
				letter-spacing: 0.04em;
				text-decoration: none;
				transition: transform 0.3s ease, background 0.3s ease;
			}
			a.home:hover { background: var(--pink); transform: translateY(-2px); }
		</style>
